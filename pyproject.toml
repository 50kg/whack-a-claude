[project]
name = "whack-a-claude"
version = "2.0.0"
description = "Local Claude data backup, restore and maintenance for Windows and macOS"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
whack-a-claude = "whack_a_claude:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["whack_a_claude"]
