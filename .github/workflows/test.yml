name: Cross-platform tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test isolated data workflows
        run: python -m unittest discover -s .github/tests -v
      - name: Verify source launcher on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\Start.bat --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source launchers on macOS
        if: runner.os == 'macOS'
        run: |
          bash -n Start.command
          ./Start.command --version
